plugins {
    id 'com.android.application' version '8.13.1'
    id 'org.jetbrains.kotlin.android' version '2.2.10'
}

def mainProject = rootProject.file('../baidu_player')
def signingProps = new Properties()
def signingPropsFile = new File(mainProject, 'local.properties')
if (signingPropsFile.isFile()) {
    signingPropsFile.withInputStream { signingProps.load(it) }
}

def keystoreOverride = System.getenv('BDPLAYER_KEYSTORE')
def keystorePath = keystoreOverride ?: signingProps.getProperty('bdplayer.keystore')
def releaseKeystore = keystorePath ? new File(keystorePath) : null
if (releaseKeystore != null && !releaseKeystore.isAbsolute()) {
    // A relative path in the main project's local.properties is resolved by its app module.
    def base = keystoreOverride ? rootProject.projectDir : new File(mainProject, 'app')
    releaseKeystore = new File(base, keystorePath)
}
def releaseStorePassword = System.getenv('BDPLAYER_STORE_PASSWORD') ?: signingProps.getProperty('bdplayer.storePassword')
def releaseKeyAlias = System.getenv('BDPLAYER_KEY_ALIAS') ?: signingProps.getProperty('bdplayer.keyAlias')
def releaseKeyPassword = System.getenv('BDPLAYER_KEY_PASSWORD') ?: signingProps.getProperty('bdplayer.keyPassword')

android {
    namespace 'com.hnwd.bdplayer.extension'
    compileSdk 36

    defaultConfig {
        applicationId 'com.hnwd.bdplayer_ext_share'
        minSdk 29
        targetSdk 35
        versionCode 2
        versionName '0.2.0'
        ndk { abiFilters 'arm64-v8a' }
    }

    buildFeatures { aidl true }
    packaging { jniLibs { useLegacyPackaging = true } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    if (releaseKeystore && releaseStorePassword && releaseKeyAlias && releaseKeyPassword) {
        signingConfigs {
            release {
                storeFile releaseKeystore
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
        buildTypes.release.signingConfig signingConfigs.release
    }
}

kotlin { jvmToolchain(17) }

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity:1.8.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'


    implementation 'io.github.junkfood02.youtubedl-android:library:0.18.1'
    implementation 'io.github.junkfood02.youtubedl-android:ffmpeg:0.18.1'
}
